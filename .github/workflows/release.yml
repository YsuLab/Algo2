# "CD" for a course project: build the exact package we upload to Blackboard.
#
#   git tag v1.0.0 && git push origin v1.0.0    -> GitHub Release with the zip attached
#   Actions -> Release -> Run workflow           -> zip as a downloadable artifact (no release)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and build jar
        run: mvn -B -ntp verify

      - name: Assemble submission folder
        run: |
          NAME="CPCS324-Part1-${GITHUB_REF_NAME//\//-}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          mkdir -p "dist/$NAME"
          cp -r src/main/java "dist/$NAME/src"
          cp campus_graph.txt README.md "dist/$NAME/"
          cp target/algo2.jar "dist/$NAME/"
          (cd dist && zip -qr "$NAME.zip" "$NAME")
          unzip -l "dist/$NAME.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: dist/${{ env.NAME }}.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/$NAME.zip" --generate-notes --title "$GITHUB_REF_NAME"
